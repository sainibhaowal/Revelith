name: Release & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Automated Versioning
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2

      - name: Install dependencies
        run: npm ci

      - name: Run Workspace Typecheck
        run: npm run typecheck

      - name: Build Native Rust Sidecars
        run: npm run native:build -w @revelith/sheets

      - name: Build All Workspaces
        run: npm run build:all

      - name: Package Desktop Artifacts (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVELITH_UPDATE_URL: ${{ secrets.REVELITH_UPDATE_URL }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npm run dist:win
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            npm run dist:linux
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            npm run dist:mac
          fi
        shell: bash

      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ needs.release-please.outputs.release_created || startsWith(github.ref, 'refs/tags/v') }}
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          files: |
            apps/shell/dist/*.exe
            apps/shell/dist/*.deb
            apps/shell/dist/*.AppImage
            apps/shell/dist/*.rpm
            apps/shell/dist/*.dmg
            apps/shell/dist/*.zip
            apps/shell/dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
